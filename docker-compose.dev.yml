services:
  backend-db:
    image: postgres:17-alpine
    container_name: opti-transit-dev-db
    restart: always
    environment:
      POSTGRES_DB: opti_transit_backend
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - dev_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d opti_transit_backend"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opti-network

  data-pipeline:
    image: ghcr.io/bafciorz/opti-transit-data-pipeline:dev
    container_name: opti-transit-dev-data-pipeline
    restart: always
    depends_on:
      backend-db:
        condition: service_healthy
    environment:
      DB_HOST: backend-db
      DB_PORT: 5432
      DB_NAME: opti_transit_pipeline
      DB_USER: dev_user
      DB_PASSWORD: dev_password
      API_KEY_WARSAW: ${API_KEY_WARSAW:-}
      GTFS_STATIC_URL: https://mkuran.pl/gtfs/warsaw.zip
      GTFS_REALTIME_VEHICLES_URL: https://mkuran.pl/gtfs/warsaw/vehicles.pb
      ARCHIVE_RETENTION_HOURS: "24"
      PARQUET_OUTPUT_DIR: /app/data/archive
    volumes:
      - data_pipeline_archive:/app/data/archive
    networks:
      - opti-network

  backend:
    image: ghcr.io/bafciorz/opti-transit-backend:dev
    container_name: opti-transit-dev-backend
    restart: always
    depends_on:
      backend-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: backend-db
      DB_PORT: 5432
      DB_NAME: opti_transit_backend
      DB_USER: dev_user
      DB_PASSWORD: dev_password
    ports:
      - "8080:8080"
    networks:
      - opti-network

networks:
  opti-network:
    driver: bridge

volumes:
  dev_db_data:
  data_pipeline_archive:
